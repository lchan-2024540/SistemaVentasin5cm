<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sistema de Ventas</title>
  <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>

<!-- Background decoration -->
<div class="login-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- Login card -->
<div class="login-card">

  <!-- Brand -->
  <div class="login-brand">
    <div class="login-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    <h1>Sistema de Ventas</h1>
    <p>ACCESO AL SISTEMA</p>
  </div>

  <!-- Error box -->
  <div class="error-msg" id="errorMsg">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="errorMsgText">Error</span>
  </div>

  <!-- Login form -->
  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label class="form-label" for="username">Usuario</label>
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" class="form-control" placeholder="Ingresa tu usuario" required />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Contraseña</label>
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" class="form-control has-toggle" placeholder="••••••••" required />
        <span class="pw-toggle" id="pwToggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
      </div>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
      <span class="btn-text">Iniciar Sesión</span>
      <div class="spinner"></div>
    </button>
  </form>

  <!-- Footer con botón Registrar -->
  <div class="login-footer">
    ¿No tienes cuenta?
    <button type="button" class="btn-register-link" id="openRegisterBtn">Regístrate aquí</button>
  </div>

</div>

<!-- ══════════════════════════════════════
     MODAL DE REGISTRO
══════════════════════════════════════ -->
<div class="modal-overlay" id="registerOverlay">
  <div class="register-modal" id="registerModal">

    <div class="register-modal-header">
      <h2>Crear cuenta</h2>
      <button class="modal-close-btn" id="closeRegisterBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Error registro -->
    <div class="error-msg" id="registerErrorMsg" style="margin-bottom:16px">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="registerErrorText">Error</span>
    </div>

    <form id="registerForm" autocomplete="off">

      <div class="form-group">
        <label class="form-label" for="regUsername">Usuario</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="regUsername" class="form-control" placeholder="Nombre de usuario" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="regEmail" class="form-control" placeholder="correo@ejemplo.com" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="regPassword" class="form-control has-toggle" placeholder="Mínimo 6 caracteres" required />
          <span class="pw-toggle" id="regPwToggle">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regConfirm">Confirmar contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="regConfirm" class="form-control" placeholder="Repite la contraseña" required />
        </div>
      </div>

      <button type="submit" class="btn-login" id="registerBtn" style="margin-top:4px">
        <span class="btn-text">Crear cuenta</span>
        <div class="spinner"></div>
      </button>

    </form>

  </div>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
