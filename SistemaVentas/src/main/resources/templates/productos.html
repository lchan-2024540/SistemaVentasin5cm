<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Productos — SistemaVentas</title>
  <link rel="stylesheet" th:href="@{/css/global.css}"/>
  <link rel="stylesheet" th:href="@{/css/entities.css}"/>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="main-wrapper">
    <main class="page-content">
      <div class="page-header fade-up">
        <div class="page-header-left">
          <h2>Productos</h2>
          <p>Inventario y catálogo de productos</p>
        </div>
        <div class="page-header-right">
          <button class="btn btn-primary" id="btnNuevoProducto">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Nuevo Producto
          </button>
        </div>
      </div>

      <div class="card fade-up">
        <div class="table-toolbar">
          <div class="table-toolbar-left">
            <div class="filter-chips">
              <button class="chip active" data-filter="todos">Todos</button>
              <button class="chip" data-filter="activo">Activos</button>
              <button class="chip" data-filter="inactivo">Inactivos</button>
              <button class="chip" data-filter="bajo-stock">Bajo Stock</button>
            </div>
          </div>
          <div class="table-toolbar-right">
            <div class="search-bar">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="text" id="searchInput" placeholder="Buscar producto..."/>
            </div>
            <span class="row-count" id="rowCount">— registros</span>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="productosTbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="productoModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Nuevo Producto</span>
      <button class="modal-close" id="modalClose">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="productoForm" autocomplete="off">
        <div class="form-grid">
          <div class="form-group" style="grid-column:1/-1">
            <label class="form-label" for="fieldNombre">Nombre del Producto *</label>
            <input type="text" id="fieldNombre" class="form-control" placeholder="Nombre del producto" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="fieldPrecio">Precio (Q) *</label>
            <input type="number" step="0.01" min="0" id="fieldPrecio" class="form-control" placeholder="0.00" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="fieldStock">Stock *</label>
            <input type="number" min="0" id="fieldStock" class="form-control" placeholder="0" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="fieldEstado">Estado *</label>
            <select id="fieldEstado" class="form-control" required>
              <option value="1">Activo</option>
              <option value="0">Inactivo</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btnCancelForm">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/productos.js}"></script>
</body>
</html>
